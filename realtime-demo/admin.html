<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SpiceCart</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #f97316;
            --primary-hover: #ea580c;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .card {
            background: var(--card);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border);
        }
        h2 { margin-top: 0; text-align: center; color: var(--primary); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        #adminSection { display: none; }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginSection" class="card">
            <h2>Admin Login</h2>
            <div id="loginMsg" class="message error"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" value="admin@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password">
            </div>
            <button onclick="login()">Login</button>
        </div>

        <div id="adminSection" class="card" style="max-width: 600px;">
            <h2>Product Management</h2>
            <div id="actionMsg" class="message"></div>
            
            <div style="border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px;">
                <label>Product Name</label>
                <input type="text" id="prodName" placeholder="e.g. Organic Cumin" style="margin-bottom: 12px;">
                <label>Price ($)</label>
                <input type="number" id="prodPrice" step="0.01" placeholder="9.99" style="margin-bottom: 12px;">
                <label>Image URL</label>
                <input type="url" id="prodImage" placeholder="https://example.com/image.jpg" style="margin-bottom: 20px;">
                <button onclick="addProduct()">Add Product</button>
            </div>

            <h3>Existing Products</h3>
            <div id="adminProdList" style="max-height: 300px; overflow-y: auto;">
                Loading...
            </div>

            <button onclick="logout()" style="margin-top: 24px; background: #64748b;">Logout</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://esumzafpfancrskftqjw.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzdW16YWZwZmFuY3Jza2Z0cWp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5ODc5NjIsImV4cCI6MjA5MzU2Mzk2Mn0.4eBmoewsuYJd4gpnO5gxrfOVs9Uci7AYzJKmZLu0_eY";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let products = [];

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('loginMsg');

            if (email !== 'admin@gmail.com') {
                msg.textContent = "Access restricted to admin.";
                msg.style.display = 'block';
                return;
            }

            const { data, error } = await client.auth.signInWithPassword({ email, password });

            if (error) {
                msg.textContent = error.message;
                msg.style.display = 'block';
            } else {
                showAdmin();
            }
        }

        async function fetchAdminProducts() {
            const { data, error } = await client.from('products').select('*').order('created_at', { ascending: false });
            if (!error) {
                products = data;
                renderAdminList();
            }
        }

        function renderAdminList() {
            const list = document.getElementById('adminProdList');
            if (products.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#64748b;">No products yet.</p>';
                return;
            }
            list.innerHTML = products.map(p => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px;">
                    <div>
                        <div style="font-weight:600;">${p.name}</div>
                        <div style="font-size:12px; color:#64748b;">$${p.price}</div>
                    </div>
                    <button onclick="deleteProduct('${p.id}')" style="width:auto; padding:6px 12px; background:#ef4444; font-size:12px;">Delete</button>
                </div>
            `).join('');
        }

        async function addProduct() {
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const image = document.getElementById('prodImage').value;
            const msg = document.getElementById('actionMsg');

            const { error } = await client.from('products').insert([{ name, price: parseFloat(price), image }]);

            msg.style.display = 'block';
            if (error) {
                msg.className = 'message error';
                msg.textContent = error.message;
            } else {
                msg.className = 'message success';
                msg.textContent = "Product added successfully!";
                document.getElementById('prodName').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodImage').value = '';
                fetchAdminProducts();
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure?')) return;
            const { error } = await client.from('products').delete().eq('id', id);
            if (error) {
                alert(error.message);
            } else {
                fetchAdminProducts();
            }
        }

        async function logout() {
            await client.auth.signOut();
            location.reload();
        }

        function showAdmin() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
            document.querySelector('.container').style.maxWidth = '600px';
            fetchAdminProducts();
        }

        client.auth.onAuthStateChange((event, session) => {
            if (session && session.user.email === 'admin@gmail.com') {
                showAdmin();
            }
        });
    </script>
</body>
</html>
